server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  # The SPA only talks to the API (8000) and Keycloak (8080) on localhost.
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8000 http://localhost:8080; frame-src http://localhost:8080; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

  location / { try_files $uri /index.html; }
  location = /healthz { access_log off; return 200 "ok\n"; }
}
